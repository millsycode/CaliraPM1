    EquipmentTimeConfig:
      title: Equipment Time Configuration
      type: object
      description: A duration with a time unit. Used for `min_booking_time` and `max_booking_time`.
      required:
      - unit
      properties:
        unit:
          $ref: '#/components/schemas/EquipmentTimeUnit'
        duration:
          description: 'Length of time in the given `unit`. Must be greater than 0. Maximum booking time cannot exceed 90
            days.

            Examples: `1`, `8`, `"1.5"`.

            '
          example: 1
          type: number
      example:
        unit: perHour
        duration: 1
    EquipmentTimeStep:
      title: Equipment Time Step
      type: object
      description: Booking time increment — the smallest step users can extend a booking by.
      required:
      - unit
      properties:
        unit:
          $ref: '#/components/schemas/EquipmentTimeUnit'
        duration:
          type: string
          description: 'Increment length in the given `unit`, as a string. Omit or send `""` to use the unit default

            (`perMinute`/`perHour` → 1 hour equivalent fallback; `perDay` → 1 day).

            Examples: `"15"` with `perMinute`, `"1"` with `perHour`, `"1"` with `perDay`.

            '
          example: '15'
      example:
        unit: perMinute
        duration: '15'
    EquipmentTimeUnit:
      title: Equipment Time Unit
      type: string
      description: 'Time unit for booking durations and increments.


        Values: `perMinute`, `perHour`, `perDay`.'
      example: perHour
    EquipmentUpdateRequest:
      title: Equipment Mutable Fields
      description: 'Request body for `PATCH /equipment/{id}`. Send only fields to change. Expand nested objects for the full
        parameter reference. At least one property required.

        '
      type: object
      additionalProperties: false
      properties:
        account_id:
          type: integer
          description: Lab account ID where the equipment belongs. **Required on create.** Cannot be changed on update.
          example: 123
        name:
          type: string
          minLength: 1
          description: Display name of the equipment. **Required on create.**
          example: API Microscope
        room:
          type: string
          description: Physical location or room name (max 255 characters).
          example: Lab 4A
        category:
          type: string
          minLength: 1
          enum:
          - Equipment
          - Parent equipment
          - Room/Space
          - Desk/Bench
          - Other
          description: Equipment category. **Required on create.**
          example: Equipment
        subcategory:
          type: string
          description: Subcategory name matching the selected `category`. Required when the category has subcategories (e.g.
            `Microscopy & Imaging` for `Equipment`).
          example: Microscopy & Imaging
        manufacturer:
          type: string
          description: Manufacturer name. Required by business rules for `Equipment`, `Other`, and `Parent equipment` categories
            (max 200 characters).
          example: Acme
        model_number:
          type: string
          description: Model or catalogue number. Required by business rules for `Equipment`, `Other`, and `Parent equipment`
            categories (max 200 characters).
          example: X1
        manufacturing_year:
          type: number
        serial_number:
          type: string
          description: Equipment serial number (max 255 characters).
          example: SN-12345
        availability_status:
          type: string
          enum:
          - Always Available
          - Unavailable
          description: 'Whether the equipment can be booked.


            Server default: Always Available.'
          example: Always Available
        description:
          type: string
          description: Plain-text description. Rich-text editor formats (HTML or Quill JSON) are not accepted — send plain
            text only.
          example: Confocal microscope for live-cell imaging.
        lab_rules:
          type: string
          description: Plain-text lab-specific usage rules shown to bookers. Send plain text only.
          example: Clean lenses after each session.
        safety_features:
          type: string
          description: Plain-text safety information shown to bookers. Send plain text only.
          example: Laser safety goggles required.
        date_of_purchase:
          type: string
          description: Purchase date as an ISO 8601 date string (e.g. `2024-01-15`).
          example: '2024-01-15'
        internal_id:
          type: string
          description: Internal inventory identifier (max 100 characters; unique per lab).
          example: EQ-0042
        purchase_price:
          type: number
        contact_access_role_ids:
          type: array
          items:
            type: integer
            example: 88
          description: Access role IDs for equipment contact people. Use `GET /equipment/contact_people?account_id={id}` to
            list valid IDs.
          example:
          - 88
          - 91
        group_ids:
          type: array
          items:
            type: integer
            example: 15
          description: IDs of user groups that should have access to book this equipment.
          example:
          - 15
          - 22
        equipment_label_ids:
          type: array
          items:
            type: integer
            example: 3
          description: IDs of equipment labels to apply.
          example:
          - 3
        maintenance_contract_ids:
          type: array
          items:
            type: integer
            example: 7
          description: IDs of maintenance contracts. May also be set inside `maintenance.maintenance_contract_ids`.
          example:
          - 7
        photos:
          $ref: '#/components/schemas/EquipmentAttachmentInput'
        documents:
          $ref: '#/components/schemas/EquipmentAttachmentInput'
        pricing:
          $ref: '#/components/schemas/EquipmentPricingInput'
        booking_rules:
          $ref: '#/components/schemas/EquipmentBookingRulesInput'
        maintenance:
          $ref: '#/components/schemas/EquipmentMaintenanceInput'
      example:
        account_id: 123
        name: API Microscope
        room: Lab 4A
        category: Equipment
        subcategory: Microscopy & Imaging
        manufacturer: Acme
        model_number: X1
        manufacturing_year: 2022
        serial_number: SN-12345
        availability_status: Always Available
        description: Confocal microscope for live-cell imaging.
        lab_rules: Clean lenses after each session.
        safety_features: Laser safety goggles required.
        date_of_purchase: '2024-01-15'
        internal_id: EQ-0042
        purchase_price: 15000
        contact_access_role_ids:
        - 88
        group_ids:
        - 15
        equipment_label_ids:
        - 3
        photos:
        - eyJfcmFpbHMiOnsiZGF0YSI6MTE3OSwicHVyIjoiYmxvYl9pZCJ9fQ==--example
        pricing:
          pricing: true
          currency: GBP
          charging_type: perHour
          price_details:
            internal: 25
        booking_rules:
          booking_rules: true
          min_booking_time:
            unit: perHour
            duration: 1
          max_booking_time:
            unit: perHour
            duration: 8
          time_step:
            unit: perMinute
            duration: '15'
          start_step:
            start_step: halfHour
        maintenance:
          maintenance_contract: true
          maintenance_contract_ids:
          - 7

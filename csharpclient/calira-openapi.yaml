        equipment_addon:
          type: string
        quantity:
          type: number
          nullable: true
        base_unit:
          type: string
        base_quantity:
          type: string
        base_price:
          type: number
        price:
          type: number
        mandatory:
          type: boolean
    BookingWriteConfiguration:
      type: object
      properties:
        id:
          type: integer
        equipment_id:
          type: integer
        equipment:
          $ref: '#/components/schemas/IdName'
        status:
          type: string
        account:
          $ref: '#/components/schemas/IdName'
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        creator:
          $ref: '#/components/schemas/IdName'
        booking_owner:

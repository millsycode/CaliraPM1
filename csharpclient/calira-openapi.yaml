    UploadDirectUploadTarget:
      title: Upload Direct Upload Target
      type: object
      description: 'Pre-signed upload target returned by `POST /uploads` (step A). Use these values for **step B** — uploading
        file bytes directly to storage.


        Send an HTTP `PUT` to `url` with every header in `headers` and the raw file as the request body. This request is made
        to cloud storage, not to the Calira API.

        '
      required:
      - url
      - headers
      properties:
        url:
          type: string
          format: uri
          description: Pre-signed URL for step B. Send `PUT` with raw file bytes to this URL. **Short-lived** — typically
            expires within 5 minutes; register a new upload if it expires before you complete step B.
          example: https://storage.example.com/rails/active_storage/disk/abc123
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers to send with the PUT of the file bytes to `url`.
    UploadRegisterRequest:
      title: Upload Register Request
      type: object
      required:
      - filename
      - content_type
      - byte_size
      - checksum
      - purpose
      properties:
        filename:
          type: string
          minLength: 1
          description: Original file name including extension.
          example: microscope.jpg
        content_type:
          type: string
          minLength: 1
          description: MIME type of the file. Must match `purpose` restrictions (see `POST /uploads`).
          example: image/jpeg
        byte_size:
          type: integer
          minimum: 1
          description: File size in bytes. Maximum 10 MB for photos, 25 MB for documents.
          example: 1048576
        checksum:
          type: string
          minLength: 1
          description: Base64-encoded MD5 digest of the file bytes.
          example: dGVzdCBjaGVja3N1bQ==
        purpose:
          type: string
          enum:
          - photo
          - document
          - booking_note
          description: '`photo` / `document` for equipment, `booking_note` for note attachments.'
    UploadRegisteredResponse:
      title: Upload Registered Response
      type: object
      required:
      - signed_id
      - filename
      - content_type
      - byte_size
      - purpose
      - direct_upload
      properties:
        signed_id:
          type: string
          description: Reference this value in `photos` or `documents` when creating or updating equipment.
        filename:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
        purpose:
          type: string
        direct_upload:
          $ref: '#/components/schemas/UploadDirectUploadTarget'
    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
      required:
      - id
      - first_name
      - last_name
      description: The user the access token belongs to.

    ContactAccessRole:
      title: Contact Access Role
      type: object
      description: An access role that may be assigned as an equipment contact person.
      properties:
        id:
          type: integer
          description: Access role ID. Use this value in `contact_access_role_ids`.
        user_id:
          type: integer
          description: User ID of the contact person.
        account_id:
          type: integer
          description: Lab account ID.
        name:
          type: string
          description: Full name of the contact person.
        email:
          type: string
          format: email
          description: Email address of the contact person.
        role:
          type: string
          description: 'Access role type.


            Values: `admin`, `instructor`.'
      required:
      - id
      - user_id
      - account_id
      - name
      - email
      - role
    ContactPeopleResponse:
      type: object
      properties:
        contact_access_roles:
          type: array
          items:
            $ref: '#/components/schemas/ContactAccessRole'
      required:
      - contact_access_roles
    CustomFormResponse:
      title: Custom Form Response
      type: object
      description: Submitted custom form response for a booking.
      properties:
        custom_form_response_id:
          type: integer
          description: Custom form response ID
        custom_form_id:
          type: integer
          description: Custom form ID
        custom_form_version_id:
          type: integer
          description: Custom form version ID
        booking_reference_id:
          type: integer
          description: Booking reference ID
        created_by:
          type: string
          description: Plain English name of the user who submitted the response.
        created_at:
          type: string
          format: date-time
          description: Date/time the response was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          description: Date/time the response was last updated (ISO 8601).
        form_response:
          type: array
          items:
            type: object
      required:
      - custom_form_response_id
      - custom_form_id
      - custom_form_version_id
      - booking_reference_id
      - created_by
      - created_at
      - updated_at
      - form_response
    CustomFormResponseReference:
      type: object
      properties:
        response_id:
          type: integer
        custom_form_version_id:
          type: integer
    Equipment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          type: string
        manufacturer:
          type: string
        model_number:
          type: string
        city:
          type: string
        country:
          type: string
        currency:
          type: string
        charging_type:
          type: string
        serial_number:
          type: string
        manufacturing_year:
          type: integer
          nullable: true
        category:
          type: string
        subcategory:
          type: string
        description:
          type: string
        image_urls:
          type: array
          items:
            type: string
        lab:
          $ref: '#/components/schemas/IdName'
        custom_addons:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentPricingAddon'
    EquipmentAdvanceBookingNotice:
      title: Equipment Advance Booking Notice
      type: object
      description: Minimum or maximum advance notice required before a booking can start.
      required:
      - unit
      properties:
        unit:
          $ref: '#/components/schemas/EquipmentAdvanceNoticeUnit'
        duration:
          description: 'Notice period length in the given `unit`.

            Examples: `24` with `hours`, `30` with `days`, `2` with `weeks`.

            '
          example: 24
          type: number
      example:
        unit: hours
        duration: 24
    EquipmentAdvanceNoticeUnit:
      title: Equipment Advance Notice Unit
      type: string
      description: 'Unit for minimum/maximum advance booking notice.


        Values: `hours`, `days`, `weeks`.'
      example: hours
    EquipmentAdvancePricing:
      title: Equipment Advance Pricing
      type: object
      description: Advanced per-day/time-slot pricing. Optional; use when `pricing.pricing` is `true`.
      required:
      - internal
      - groups
      properties:
        internal:
          $ref: '#/components/schemas/EquipmentAdvancePricingSubPricing'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentAdvancePricingGroup'
          description: Per-group advance pricing overrides. Pass `[]` if none.
          example: []
      example:
        internal:
          default_price: 25
          days:
            monday:
            - day: monday
              start_time: 09:00
              end_time: '12:00'
              price: 40
            tuesday: []
            wednesday: []
            thursday: []
            friday: []
            saturday: []
            sunday: []
        groups: []
    EquipmentAdvancePricingDays:
      title: Equipment Advance Pricing Days
      type: object
      description: Per-weekday arrays of advance pricing slots. Keys are lowercase day names (`monday`–`sunday`).
      properties:
        monday:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentAdvancePricingSlot'
          example:
          - day: monday
            start_time: 09:00
            end_time: '12:00'
            price: 40
        tuesday:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentAdvancePricingSlot'
          example: []
        wednesday:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentAdvancePricingSlot'
          example: []
        thursday:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentAdvancePricingSlot'
          example: []
        friday:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentAdvancePricingSlot'
          example: []
        saturday:
          type: array

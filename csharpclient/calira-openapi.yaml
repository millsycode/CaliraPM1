openapi: 3.0.3
info:
  title: Calira API
  version: 1.0.0
  description: 'Calira (formerly Clustermarket) REST API. Built from the app-clustermarket feature/post-mvp-booking-api branch.
    Reference: https://apidocs.clustermarket.com/'
  contact:
    name: Calira support
    email: support@calira.co
    url: https://calira.co/support
servers:
- url: https://api.clustermarket.com/v1
  description: Production
- url: https://api.clustermarket.dev/v1
  description: Staging
- url: https://5975.api.review.clustermarket.dev/v1
  description: Review app (pre-release testing)
tags:
- name: User
- name: Accounts
- name: Projects
- name: Groups
- name: Users
- name: Equipment
- name: Bookings
- name: BookingNotes
- name: Uploads
paths:
  /user:
    get:
      operationId: getCurrentUser
      tags:
      - User
      summary: Get current user
      description: Details of the user the access token belongs to.
      security:
      - oauth:
        - read_user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /accounts:
    get:
      operationId: listAccounts
      tags:
      - Accounts
      summary: List accounts
      description: 'Accounts (organisations, departments, labs) the application can access.


        Paged: use `page` and `per_page` (max 100). Totals are in the `X-Total-Records`, `X-Current-Page` and `X-Per-Page`
        response headers.'
      security:
      - oauth:
        - read_accounts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /accounts/{id}:
    get:
      operationId: getAccount
      tags:
      - Accounts
      summary: Get account
      description: Full details of one account.
      security:
      - oauth:
        - read_accounts
      parameters:
      - name: id
        in: path
        required: true
        description: Account ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /accounts/{account_id}/projects:
    get:
      operationId: listProjects
      tags:
      - Projects
      summary: List projects
      description: 'Projects in a lab.


        Paged: use `page` and `per_page` (max 100). Totals are in the `X-Total-Records`, `X-Current-Page` and `X-Per-Page`
        response headers.'
      security:
      - oauth:
        - read_projects
      parameters:
      - name: account_id
        in: path
        required: true
        description: Lab account ID
        schema:
          type: integer
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /accounts/{account_id}/projects/{id}:
    get:
      operationId: getProject
      tags:
      - Projects
      summary: Get project
      description: One project with its funding codes and users.
      security:
      - oauth:
        - read_projects
      parameters:
      - name: account_id
        in: path
        required: true
        description: Lab account ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: Project ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /groups:
    get:
      operationId: listGroups
      tags:
      - Groups
      summary: List groups
      description: 'User groups, optionally only for one lab.


        Paged: use `page` and `per_page` (max 100). Totals are in the `X-Total-Records`, `X-Current-Page` and `X-Per-Page`
        response headers.'
      security:
      - oauth:
        - read_accounts
      parameters:
      - name: account
        in: query
        required: false
        description: Lab account ID
        schema:
          type: integer
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /groups/{id}:
    get:
      operationId: getGroup
      tags:
      - Groups
      summary: Get group
      description: One group with its equipment.
      security:
      - oauth:
        - read_accounts
      parameters:
      - name: id
        in: path
        required: true
        description: Group ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetails'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /users/{account_id}:
    get:
      operationId: listLabUsers
      tags:
      - Users
      summary: List lab users
      description: 'Members of a lab. The ID is a lab (account) ID, not a user ID.


        Paged: use `page` and `per_page` (max 100). Totals are in the `X-Total-Records`, `X-Current-Page` and `X-Per-Page`
        response headers.'
      security:
      - oauth:
        - read_users
      parameters:
      - name: account_id
        in: path
        required: true
        description: Lab account ID
        schema:
          type: integer
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabMember'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /equipment:
    get:
      operationId: listEquipment
      tags:
      - Equipment
      summary: List equipment
      description: 'Equipment, optionally only for one lab.


        Paged: use `page` and `per_page` (max 100). Totals are in the `X-Total-Records`, `X-Current-Page` and `X-Per-Page`
        response headers.'
      security:
      - oauth:
        - read_equipment
      parameters:
      - name: account
        in: query
        required: false
        description: Lab account ID
        schema:
          type: integer
      - name: exclude_parents
        in: query
        required: false
        description: Set to true to leave out parent equipment.
        schema:
          type: boolean
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentSummary'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: createEquipment
      tags:
      - Equipment
      summary: Create equipment
      description: Create a piece of equipment. Rate limited to 30 requests/minute.
      security:
      - oauth:
        - write_equipment
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentWriteResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentCreateRequest'
  /equipment/contact_people:
    get:
      operationId: listEquipmentContactPeople
      tags:
      - Equipment
      summary: List equipment contact people
      description: Lab admins and instructors who can be set as equipment contacts (use their IDs in `contact_access_role_ids`).
      security:
      - oauth:
        - write_equipment
      parameters:
      - name: account_id
        in: query
        required: true
        description: Lab account ID
        schema:
          type: integer
      - name: equipment_id
        in: query
        required: false
        description: Check rights to update this equipment
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPeopleResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /equipment/{id}:
    get:
      operationId: getEquipment
      tags:
      - Equipment
      summary: Get equipment
      description: Full details of one piece of equipment.
      security:
      - oauth:
        - read_equipment
      parameters:
      - name: id
        in: path
        required: true
        description: Equipment ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      operationId: updateEquipment
      tags:
      - Equipment
      summary: Update equipment
      description: Update a piece of equipment. Send only the fields to change. Rate limited to 30 requests/minute.
      security:
      - oauth:
        - write_equipment
      parameters:
      - name: id
        in: path
        required: true
        description: Equipment ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentWriteResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentUpdateRequest'
  /equipment/{id}/bookings:
    get:
      operationId: listEquipmentBookings
      tags:
      - Equipment
      summary: List equipment bookings
      description: 'Bookings on one piece of equipment.


        Paged: use `page` and `per_page` (max 100). Totals are in the `X-Total-Records`, `X-Current-Page` and `X-Per-Page`
        response headers.'
      security:
      - oauth:
        - read_equipment
        - read_bookings
      parameters:
      - name: id
        in: path
        required: true
        description: Equipment ID
        schema:
          type: integer
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingSummary'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /equipment/{id}/users:
    get:
      operationId: listEquipmentUsers
      tags:
      - Users
      summary: List equipment users
      description: Users who have access to a piece of equipment (e.g. to invite to a group booking).
      security:
      - oauth:
        - read_users
      parameters:
      - name: id
        in: path
        required: true
        description: Equipment ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentUsersResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /equipment/{id}/booking_add_ons:
    get:
      operationId: listBookingAddOns
      tags:
      - Equipment
      summary: List booking add-ons
      description: Add-ons (e.g. consumables) the current user can add to a booking on this equipment.
      security:
      - oauth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Equipment ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAddOnsResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /equipment_available_slots/{equipment_id}:
    get:
      operationId: getAvailableSlots
      tags:
      - Bookings
      summary: Get available slots
      description: Free time on a piece of equipment between `start_time` and `end_time`.
      security:
      - oauth:
        - write_bookings
      parameters:
      - name: equipment_id
        in: path
        required: true
        description: Equipment ID
        schema:
          type: integer
      - name: start_time
        in: query
        required: true
        description: Start of the search window (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: end_time
        in: query
        required: true
        description: End of the search window (ISO 8601).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableSlotsResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /bookings:
    get:
      operationId: listBookings
      tags:
      - Bookings
      summary: List bookings
      description: 'Bookings the user can see, optionally only for one lab.


        Paged: use `page` and `per_page` (max 100). Totals are in the `X-Total-Records`, `X-Current-Page` and `X-Per-Page`
        response headers.'
      security:
      - oauth:
        - read_bookings
      parameters:
      - name: provider_account
        in: query
        required: false
        description: Providing lab account ID
        schema:
          type: integer
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingSummary'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: createBooking
      tags:
      - Bookings
      summary: Create booking
      description: Book a piece of equipment. Business-rule failures return 403. Rate limited to 30 requests/minute.
      security:
      - oauth:
        - write_bookings
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingWriteResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
  /bookings/{id}:
    get:
      operationId: getBooking
      tags:
      - Bookings
      summary: Get booking
      description: Full details of one booking.
      security:
      - oauth:
        - read_bookings
      parameters:
      - name: id
        in: path
        required: true
        description: Booking ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      operationId: updateBooking
      tags:
      - Bookings
      summary: Update booking
      description: Change a booking. Send only the fields to change. Rate limited to 30 requests/minute.
      security:
      - oauth:
        - write_bookings
      parameters:
      - name: id
        in: path
        required: true
        description: Booking ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingWriteResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdateRequest'
  /bookings/{id}/invitation:
    post:
      operationId: respondToBookingInvitation
      tags:
      - Bookings
      summary: Respond to booking invitation
      description: Accept or reject an invitation to a group booking. The token user must be the invitee. Rate limited to
        30 requests/minute.
      security:
      - oauth:
        - write_bookings
      parameters:
      - name: id
        in: path
        required: true
        description: Booking ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingInvitationRespondResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInvitationRespondRequest'
  /booking/notes/{id}:
    post:
      operationId: createBookingNote
      tags:
      - BookingNotes
      summary: Create booking note
      description: Add a note (optionally with an attached file) to a booking. `id` is the BOOKING ID.
      security:
      - oauth:
        - write_bookings
      parameters:
      - name: id
        in: path
        required: true
        description: Booking ID
        schema:
          type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingNoteResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingNoteRequest'
    patch:
      operationId: updateBookingNote
      tags:
      - BookingNotes
      summary: Update booking note
      description: Change a booking note. `id` is the NOTE ID (booking_note.note_id from create), not the booking ID.
      security:
      - oauth:
        - write_bookings
      parameters:
      - name: id
        in: path
        required: true
        description: Note ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingNoteResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingNoteRequest'
  /custom_form_responses/{id}:
    get:
      operationId: getCustomFormResponse
      tags:
      - Bookings
      summary: Get custom form response
      description: Answers given on a booking form. IDs are listed in each booking's `custom_form_responses`.
      security:
      - oauth:
        - read_bookings
      parameters:
      - name: id
        in: path
        required: true
        description: Custom form response ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFormResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /uploads:
    post:
      operationId: registerUpload
      tags:
      - Uploads
      summary: Register upload
      description: 'Step 1 of a file upload: register the file, then PUT its bytes to `direct_upload.url` with `direct_upload.headers`.
        Use the returned `signed_id` in equipment `photos`/`documents` or a booking note. Rate limited to 30 requests/minute.'
      security:
      - oauth:
        - write_equipment
      - oauth:
        - write_bookings
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRegisteredResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRegisterRequest'
components:
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.clustermarket.com/oauth/authorize
          tokenUrl: https://app.clustermarket.com/oauth/token
          refreshUrl: https://app.clustermarket.com/oauth/token
          scopes:
            read_accounts: Read accounts and groups.
            read_bookings: Read bookings.
            read_equipment: Read equipment.
            read_projects: Read projects and funding codes.
            read_user: Read the current user.
            read_users: Read lab members and equipment users.
            write_bookings: Create/update bookings and notes, respond to invitations, read available slots.
            write_equipment: Create/update equipment and register uploads.
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-based, default 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Records per page (1-100, default 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
  responses:
    Error400:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Missing, invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Missing scope, application not approved/authorised for the lab, user not permitted, or a booking business
        rule failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Record not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Validation failed. See `errors` for details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Too many write requests (30/minute per IP). Retry with backoff.
      content:
        text/html:
          schema:
            type: string
    Error500:
      description: Unexpected server error. Retry with exponential backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Account:
      title: Account
      type: object
      description: Represents an organisation, department or lab.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: Cambridge Graphene Center
        account_type:
          type: string
          example: lab
          description: 'Server default: lab.


            Values: `organisation`, `department`, `lab`.'
        sector:
          type: string
          description: 'Values: `academia`, `industry`.'
        description:
          type: string
        website:
          type: string
          maxLength: 200
          example: https://www.graphene.cam.ac.uk/
        timezone:
          type: string
          example: Europe/London
        department:
          $ref: '#/components/schemas/IdName'
        organisation:
          $ref: '#/components/schemas/IdName'
        labs:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        departments:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
      required:
      - id
      - name
      - account_type
    AccountSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        account_type:
          type: string
          description: 'Values: `lab`, `department`, `organisation`.'
        organisation:
          type: integer
          nullable: true
          description: Organisation account ID.
        department:
          type: integer
          nullable: true
          description: Department account ID.
    AvailableSlot:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
    AvailableSlotsResponse:
      type: object
      properties:
        available_slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSlot'
    Booking:
      type: object
      properties:
        id:
          type: integer
        cost:
          type: string
          nullable: true
          description: Booking cost as a decimal string.
        currency:
          type: string
        charging_type:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        requested_at:
          type: string
          format: date-time
        booking_type:
          type: string
        status:
          type: string
        duration:
          type: number
          description: Duration in minutes.
        add_ons:
          type: string
          nullable: true
          description: Add-on names separated by "; ".
        maintenance_provider:
          type: string
          nullable: true
        maintenance_type:
          type: string
          nullable: true
        custom_form_responses:
          type: array
          items:
            $ref: '#/components/schemas/CustomFormResponseReference'
        requester_group:
          type: object
          properties:
            name:
              type: string
        equipment:
          $ref: '#/components/schemas/IdName'
        parent_equipment:
          $ref: '#/components/schemas/IdName'
        requester_lab:
          $ref: '#/components/schemas/IdName'
        requester_organisation:
          $ref: '#/components/schemas/IdName'
        provider_lab:
          $ref: '#/components/schemas/IdName'
        provider_organisation:
          $ref: '#/components/schemas/IdName'
        creator:
          $ref: '#/components/schemas/IdName'
        requester:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            sector:
              type: string
        last_public_note:
          $ref: '#/components/schemas/LastPublicNote'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/BookingProject'
    BookingAddOn:
      type: object
      properties:
        equipment_addon:
          type: string
          description: Add-on name. Use this in `add_ons` when creating or updating a booking.
        base_unit:
          type: string
        base_quantity:
          type: string
        base_price:
          type: number
        mandatory:
          type: boolean
    BookingAddOnInput:
      type: object
      properties:
        equipment_addon:
          type: string
          description: Name from GET /equipment/{id}/booking_add_ons.
        quantity:
          type: string
          description: Quantity as a decimal string, e.g. "2" or "1.5".
    BookingAddOnsResponse:
      type: object
      properties:
        add_ons:
          type: array
          items:
            $ref: '#/components/schemas/BookingAddOn'
    BookingCreateRequest:
      type: object
      properties:
        account_id:
          type: integer
          description: Lab account ID. Defaults to the equipment's lab.
        equipment_id:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        booking_type:
          type: string
          enum:
          - use
          - maintenance
          description: Defaults to `use`.
        maintenance_provider:
          type: string
          enum:
          - internal
          - external
          description: Required for maintenance bookings only.
        maintenance_type:
          type: string
          enum:
          - preventative_maintenance
          - cleaning
          - calibration
          - breakdown
          - repair
          - other
          description: Required for maintenance bookings only.
        projects:
          type: array
          items:
            $ref: '#/components/schemas/BookingProjectInput'
        booking_on_behalf_of:
          type: integer
          description: User ID to create the booking for (lab admins/instructors).
        invited_users:
          type: array
          items:
            $ref: '#/components/schemas/BookingInvitedUserInput'
        recurrence:
          $ref: '#/components/schemas/BookingRecurrenceInput'
        add_ons:
          type: array
          items:
            $ref: '#/components/schemas/BookingAddOnInput'
      required:
      - equipment_id
      - start_time
      - end_time
    BookingFundingCodeInput:
      type: object
      properties:
        funding_code_id:
          type: integer
        funding_code_percentage:
          type: integer
          description: 0-100. Percentages for a project must total 100.
      required:
      - funding_code_id
      - funding_code_percentage
    BookingInvitation:
      title: Booking Invitation
      type: object
      description: A booking invitation for a specific user.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
          description: 'Values: `pending`, `accepted`, `rejected`.'
        booking_id:
          type: integer
          readOnly: true
          description: ID of the booking this invitation belongs to.
        reject_reason:
          type: string
          nullable: true
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: object
          readOnly: true
          properties:
            id:
              type: integer
            name:
              type: string
          required:
          - id
          - name
      required:
      - id
      - status
      - booking_id
    BookingInvitationRespondRequest:
      title: Booking Invitation Respond Request
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - accept
          - reject
          description: 'The action to take on the invitation.

            - `accept` — confirm attendance; may trigger calendar sync and notifications

            - `reject` — decline the invitation; optionally include `reject_reason`

            '
        reject_reason:
          type: string
          description: Optional free-text reason stored when `status` is `reject`. Ignored when accepting.
        request_scope:
          type: string
          enum:
          - current
          - subsequent
          - all
          description: 'For recurring bookings only. Controls which invitations in the series are affected.


            Server default: current.'
        accept_available:
          type: boolean
          description: 'When accepting with `request_scope` of `subsequent` or `all`, controls conflict behaviour.

            If `false` (default) and scheduling conflicts exist, no invitations are accepted.

            If `true`, non-conflicting invitations are accepted and conflicting ones are returned in `conflicting_invitations`.


            Server default: False.'
    BookingInvitationRespondResponse:
      type: object
      properties:
        booking_invitation:
          $ref: '#/components/schemas/BookingInvitation'
        processed_invitations:
          type: array
          items:
            $ref: '#/components/schemas/BookingInvitation'
        conflicting_invitations:
          type: array
          items:
            $ref: '#/components/schemas/BookingInvitation'
        errors:
          type: array
          items:
            type: object
    BookingInvitedUserInput:
      type: object
      properties:
        user_id:
          type: integer
      required:
      - user_id
    BookingNote:
      type: object
      properties:
        note_id:
          type: integer
        note_text:
          type: string
        note_author:
          type: string
        note_user_id:
          type: integer
        note_file_signed_id:
          type: string
          nullable: true
    BookingNoteInput:
      type: object
      properties:
        note_text:
          type: string
        note_file_signed_id:
          type: string
          nullable: true
          description: signed_id from POST /uploads (purpose `booking_note`) to attach a file.
    BookingNoteRequest:
      type: object
      properties:
        booking_note:
          $ref: '#/components/schemas/BookingNoteInput'
      required:
      - booking_note
    BookingNoteResponse:
      type: object
      properties:
        success:
          type: boolean
        booking_id:
          type: integer
        booking_note:
          $ref: '#/components/schemas/BookingNote'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
    BookingProject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        supervisor:
          type: string
        funding_codes:
          type: array
          items:
            type: object
    BookingProjectInput:
      type: object
      properties:
        project_id:
          type: integer
        funding_codes:
          type: array
          items:
            $ref: '#/components/schemas/BookingFundingCodeInput'
      required:
      - project_id
    BookingRecurrenceInput:
      type: object
      properties:
        recurrence_type:
          type: string
          enum:
          - daily
          - weekly
          - monthly_absolute
          - monthly_relative
          - yearly
        recurrence_interval:
          type: integer
          description: Repeat every N days/weeks/months/years. Must be positive.
        recurrence_end:
          type: string
          format: date
          description: Last date of the series (YYYY-MM-DD).
        recurrence_days:
          type: array
          items:
            type: string
            enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          description: 'Weekly only: the days to repeat on.'
        recurrence_date:
          type: integer
          description: 'monthly_absolute only: day of the month (must match the start date).'
        recurrence_action:
          type: string
          enum:
          - skip_conflict
          - overlap_existing
          - decline_existing
          description: What to do on conflicts. `overlap_existing`/`decline_existing` need lab admin/instructor rights.
      required:
      - recurrence_type
      - recurrence_interval
      - recurrence_end
    BookingSummary:
      type: object
      properties:
        id:
          type: integer
        equipment_id:
          type: integer
        user_id:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        requested_at:
          type: string
          format: date-time
        status:
          type: string
        booking_type:
          type: string
        maintenance_provider:
          type: string
          nullable: true
        maintenance_type:
          type: string
          nullable: true
        equipment:
          type: object
          properties:
            name:
              type: string
        last_public_note:
          $ref: '#/components/schemas/LastPublicNote'
    BookingUpdateRequest:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        maintenance_provider:
          type: string
          enum:
          - internal
          - external
          description: Maintenance bookings only.
        maintenance_type:
          type: string
          enum:
          - preventative_maintenance
          - cleaning
          - calibration
          - breakdown
          - repair
          - other
          description: Maintenance bookings only.
        invited_users:
          type: array
          items:
            $ref: '#/components/schemas/BookingInvitedUserInput'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/BookingProjectInput'
        add_ons:
          type: array
          items:
            $ref: '#/components/schemas/BookingAddOnInput'
      description: Send only the fields to change. At least one field is required.
    BookingWriteAddOn:
      type: object

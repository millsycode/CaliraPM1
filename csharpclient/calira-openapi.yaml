    EquipmentCreateRequest:
      title: Equipment Mutable Fields
      description: 'Request body for `POST /equipment`. Expand nested objects (`pricing`, `booking_rules`, `maintenance`)
        for every sub-field, type, and allowed value.

        '
      type: object
      additionalProperties: false
      properties:
        account_id:
          type: integer
          description: Lab account ID where the equipment belongs. **Required on create.** Cannot be changed on update.
          example: 123
        name:
          type: string
          minLength: 1
          description: Display name of the equipment. **Required on create.**
          example: API Microscope
        room:
          type: string
          description: Physical location or room name (max 255 characters).
          example: Lab 4A
        category:
          type: string
          minLength: 1
          enum:
          - Equipment
          - Parent equipment
          - Room/Space
          - Desk/Bench
          - Other
          description: Equipment category. **Required on create.**
          example: Equipment
        subcategory:
          type: string
          description: Subcategory name matching the selected `category`. Required when the category has subcategories (e.g.
            `Microscopy & Imaging` for `Equipment`).
          example: Microscopy & Imaging
        manufacturer:
          type: string
          description: Manufacturer name. Required by business rules for `Equipment`, `Other`, and `Parent equipment` categories
            (max 200 characters).
          example: Acme
        model_number:
          type: string
          description: Model or catalogue number. Required by business rules for `Equipment`, `Other`, and `Parent equipment`
            categories (max 200 characters).
          example: X1
        manufacturing_year:
          type: number
        serial_number:
          type: string
          description: Equipment serial number (max 255 characters).
          example: SN-12345
        availability_status:
          type: string
          enum:
          - Always Available
          - Unavailable
          description: 'Whether the equipment can be booked.


            Server default: Always Available.'
          example: Always Available
        description:
          type: string
          description: Plain-text description. Rich-text editor formats (HTML or Quill JSON) are not accepted — send plain
            text only.
          example: Confocal microscope for live-cell imaging.
        lab_rules:
          type: string
          description: Plain-text lab-specific usage rules shown to bookers. Send plain text only.
          example: Clean lenses after each session.
        safety_features:
          type: string
          description: Plain-text safety information shown to bookers. Send plain text only.
          example: Laser safety goggles required.
        date_of_purchase:
          type: string
          description: Purchase date as an ISO 8601 date string (e.g. `2024-01-15`).
          example: '2024-01-15'
        internal_id:
          type: string
          description: Internal inventory identifier (max 100 characters; unique per lab).
          example: EQ-0042
        purchase_price:
          type: number
        contact_access_role_ids:
          type: array
          items:
            type: integer
            example: 88
          description: Access role IDs for equipment contact people. Use `GET /equipment/contact_people?account_id={id}` to
            list valid IDs.
          example:
          - 88
          - 91
        group_ids:
          type: array
          items:
            type: integer
            example: 15
          description: IDs of user groups that should have access to book this equipment.
          example:
          - 15
          - 22
        equipment_label_ids:
          type: array
          items:
            type: integer
            example: 3
          description: IDs of equipment labels to apply.
          example:
          - 3
        maintenance_contract_ids:
          type: array
          items:
            type: integer
            example: 7
          description: IDs of maintenance contracts. May also be set inside `maintenance.maintenance_contract_ids`.
          example:
          - 7
        photos:
          $ref: '#/components/schemas/EquipmentAttachmentInput'
        documents:
          $ref: '#/components/schemas/EquipmentAttachmentInput'
        pricing:
          $ref: '#/components/schemas/EquipmentPricingInput'
        booking_rules:
          $ref: '#/components/schemas/EquipmentBookingRulesInput'
        maintenance:
          $ref: '#/components/schemas/EquipmentMaintenanceInput'
      example:
        account_id: 123
        name: API Microscope
        room: Lab 4A
        category: Equipment
        subcategory: Microscopy & Imaging
        manufacturer: Acme
        model_number: X1
        manufacturing_year: 2022
        serial_number: SN-12345
        availability_status: Always Available
        description: Confocal microscope for live-cell imaging.
        lab_rules: Clean lenses after each session.
        safety_features: Laser safety goggles required.
        date_of_purchase: '2024-01-15'
        internal_id: EQ-0042
        purchase_price: 15000
        contact_access_role_ids:
        - 88
        group_ids:
        - 15
        equipment_label_ids:
        - 3
        photos:
        - eyJfcmFpbHMiOnsiZGF0YSI6MTE3OSwicHVyIjoiYmxvYl9pZCJ9fQ==--example
        pricing:
          pricing: true
          currency: GBP
          charging_type: perHour
          price_details:
            internal: 25
        booking_rules:
          booking_rules: true
          min_booking_time:
            unit: perHour
            duration: 1
          max_booking_time:
            unit: perHour
            duration: 8
          time_step:
            unit: perMinute
            duration: '15'
          start_step:
            start_step: halfHour
        maintenance:
          maintenance_contract: true
          maintenance_contract_ids:
          - 7
      required:
      - account_id
      - name
      - category
    EquipmentDailyUsageSchedule:
      title: Equipment Daily Usage Schedule
      type: object
      description: Opening hours for a single day within business hours configuration.
      required:
      - allow
      properties:
        allow:
          type: boolean
          description: Whether the equipment is bookable on this day.
          example: true
        start_time:
          type: string
          pattern: ^([0-9][0-9]):([0-5][0-9])$
          description: Opening time in `HH:MM` (24-hour). Required when `allow` is `true`.
          example: 09:00
        end_time:
          type: string
          pattern: ^([0-9][0-9]):([0-5][0-9])$
          description: Closing time in `HH:MM` (24-hour). Required when `allow` is `true`.
          example: '17:00'
      example:
        allow: true
        start_time: 09:00
        end_time: '17:00'
    EquipmentMaintenanceInput:
      title: Equipment Maintenance Input
      type: object
      description: Maintenance contract configuration. Pass as the `maintenance` property on create/update.
      properties:
        maintenance_contract:
          type: boolean
          description: 'Whether a maintenance contract applies to this equipment.


            Server default: False.'
          example: true
        maintenance_contract_ids:
          type: array
          items:
            type: integer
            example: 7
          description: IDs of maintenance contracts linked to this equipment. Requires lab maintenance feature.
          example:
          - 7
          - 12
      example:
        maintenance_contract: true
        maintenance_contract_ids:
        - 7
        - 12
    EquipmentNumeric:
      type: number
      description: Numeric value.
    EquipmentPriceDetails:
      title: Equipment Price Details
      type: object
      description: Base price configuration. Required when `pricing.pricing` is `true`.
      required:
      - internal
      properties:
        internal:
          $ref: '#/components/schemas/EquipmentNumeric'
      example:
        internal: 25
    EquipmentPricingAddon:
      title: Equipment Pricing Addon
      type: object
      description: Optional add-on charge line item. Pass in `pricing.custom_addons` or `pricing.other_attributes`.
      required:
      - id
      - equipment_addon
      - mandatory_external
      - mandatory_internal
      - price
      - quantity
      properties:
        id:
          description: Add-on identifier.
          example: 1
          type: integer
        equipment_addon:
          type: string
          minLength: 1
          description: Add-on name or label.
          example: Sample preparation
        mandatory_external:
          type: string
          description: 'Mandatory flag for external bookers. Empty string means not mandatory.


            Values: `AAV`, `FBO`, `OPT`.'
          example: ''
        mandatory_internal:
          type: string
          description: 'Mandatory flag for internal bookers. Empty string means not mandatory.


            Values: `AAV`, `FBO`, `OPT`.'
          example: OPT
        price:
          $ref: '#/components/schemas/EquipmentNumeric'
        quantity:
          type: string
          description: 'How the add-on quantity is determined.


            Values: `fixed`, `as_booking_hours`, `as_booking_days`, `user_specified`.'
          example: fixed
        unit:
          type: string
          description: 'Billing unit. Required when `quantity` is `user_specified`.

            Auto-set to `per_hour` when `quantity` is `as_booking_hours`, `per_day` when `as_booking_days`, and `""` when
            `fixed`.


            Values: `per_sample`, `per_day`, `per_hour`, `per_run`.'
          example: ''
      example:
        id: 1
        equipment_addon: Sample preparation
        mandatory_external: ''
        mandatory_internal: OPT
        price: 10
        quantity: fixed
        unit: ''
    EquipmentPricingInput:
      title: Equipment Pricing Input
      type: object
      description: 'Pricing configuration object. Pass as the top-level `pricing` property on create/update.


        When `pricing` is `true`, `price_details.internal` is required.

        '
      properties:
        pricing:
          type: boolean
          description: 'Whether charging is enabled for this equipment.


            Server default: False.'
          example: true
        currency:
          type: string
          description: 'ISO currency code for all prices on this equipment.


            Server default: GBP.


            Values: `GBP`, `USD`, `EUR`, `AED`, `AUD`, `BRL`, `CAD`, `CHF`, `CLP`, `DKK`, `HKD`, `ILS`, `INR`, `ISK`, `JPY`,
            `NOK`, `NZD`, `PLN`, `RUB`, `SEK`, `SGD`, `TRY`, `ZAR`.'
          example: GBP
        available_internally:
          type: boolean
          description: 'Whether internal lab users can book at internal rates.


            Server default: True.'
          example: true
        charging_type:
          type: string
          description: 'How the base price is charged.


            Server default: perHour.


            Values: `perHour`, `perDay`.'
          example: perHour
        purchase_price:
          $ref: '#/components/schemas/EquipmentNumeric'
        custom_addons:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentPricingAddon'
          description: Optional add-on charges. Alias of `other_attributes`.
          example:
          - id: 1
            equipment_addon: Sample preparation
            mandatory_external: ''
            mandatory_internal: OPT
            price: 10
            quantity: fixed
            unit: ''
        other_attributes:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentPricingAddon'
          description: Optional add-on charges. Alias of `custom_addons`.
          example: []
        price_details:
          $ref: '#/components/schemas/EquipmentPriceDetails'
        advance_pricing:
          $ref: '#/components/schemas/EquipmentAdvancePricing'
      example:
        pricing: true
        currency: GBP
        available_internally: true
        charging_type: perHour
        purchase_price: 15000
        price_details:
          internal: 25
        custom_addons:
        - id: 1
          equipment_addon: Sample preparation
          mandatory_external: ''
          mandatory_internal: OPT
          price: 10
          quantity: fixed
          unit: ''
        advance_pricing:
          internal:
            default_price: 25
            days:
              monday:
              - day: monday
                start_time: 09:00
                end_time: '12:00'
                price: 40
              tuesday: []
              wednesday: []
              thursday: []
              friday: []
              saturday: []
              sunday: []
          groups: []
    EquipmentStartStep:
      title: Equipment Start Step
      type: object
      description: Controls when bookings may start within each hour or day.
      required:
      - start_step
      properties:
        start_step:
          type: string
          description: 'When bookings can start:

            - `quarter` — every 15 minutes

            - `halfHour` — every 30 minutes

            - `fullHour` — on the hour

            - `fullDay` — once per day

            - `custom` — use `custom` array


            Values: `quarter`, `halfHour`, `fullHour`, `fullDay`, `custom`.'
          example: halfHour
        custom:
          type: array
          items:
            type: string
            pattern: ^([0-9][0-9]):([0-5][0-9])$
            example: 09:00
          description: Required when `start_step` is `custom`. Array of `HH:MM` times when bookings may start.
          example:
          - 09:00
          - '13:00'
      example:
        start_step: halfHour
    EquipmentSummary:

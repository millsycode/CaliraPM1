    BookingWriteProject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        funding_codes:
          type: array
          items:
            $ref: '#/components/schemas/BookingWriteFundingCode'
    BookingWriteRecurrence:
      type: object
      properties:

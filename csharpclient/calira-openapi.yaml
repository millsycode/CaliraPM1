        manufacturer:
          type: string
        model_number:
          type: string
        manufacturing_year:
          type: integer
          nullable: true
        serial_number:
          type: string
        availability_status:
          type: string
        description:
          type: string
          description: Plain-text description.
        lab_rules:
          type: string
          description: Plain-text lab-specific usage rules.
        safety_features:
          type: string
          description: Plain-text safety information.
        date_of_purchase:
